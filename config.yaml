# Project configuration
# Phase 1: only structural/project-level settings.
# Dataset, agent, and defense settings will be added in later phases.

project:
  name: "iot-agent-security-eval"
  description: "Security evaluation of LLM-based agents for IoT attack detection"
  phase: 2

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_adversarial: "data/adversarial"
  results_tables: "results/tables"
  results_plots: "results/plots"

experiment:
  random_seed: 42

# Phase 2: dataset and preprocessing settings.
# Dataset choice: Edge-IIoTset (see README for why).
dataset:
  name: "Edge-IIoTset"
  # Column names Edge-IIoTset commonly ships with. The pipeline checks these
  # in order and uses the first one it finds, so this also works if you're
  # using a differently-named CSV variant.
  label_column_candidates:
    - "attack_type"
    - "attack_label"
    - "label"
    - "class"
  # Text values in the label column that mean "no attack" -> BENIGN.
  # Everything else is mapped to ATTACK.
  benign_values:
    - "normal"
    - "benign"
    - "0"
    - "no attack"
  split:
    val_size: 0.15
    test_size: 0.15

# Phase 3: single-shot classifier agent settings.
agent:
  provider: "gemini"
  model: "gemini-3.1-flash-lite"
  temperature: 0.0
  excluded_from_prompt:
    - "label"
    - "attack_type"
    - "attack_label"


# Phase 5: adversarial test corpus settings.
adversarial:
  corpus_path: "data/adversarial/adversarial_corpus.csv"
  results_path: "results/tables/adversarial_results.csv"
  cases_per_category:
    direct_injection: 12
    tool_poisoning: 10
    compound_poisoning: 8
    context_flooding: 10
  injection_field: "mqtt.topic"   # attacker-controlled field that payloads are placed into
  flood_repeats: 12               # how many decoy lines the flooding attack adds
  pause_seconds: 5                # pause between API calls (free-tier rate limits)


# Phase 6: defense layer settings.
defenses:
  available:
    - "none"
    - "evidence_first"
    - "verification_gate"
  # verification_gate only applies to the react agent (it has no meaning
  # for single_shot, which has no tool) -- the runner skips it there automatically.